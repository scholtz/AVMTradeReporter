name: Promote to Production

# Manual-only pipeline. Run this once a version has been built by "Build and Deploy" (deploy.yml) and
# verified on stage. It re-tags that version's already-pushed API and Subscriber images as "latest" in
# Docker Hub and deploys them to production (k8s/main/*, mainnet) - it never builds a new image itself.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version string to promote, exactly as produced by the "build" job in deploy.yml
          (e.g. 1.2026.08.07-main). Find it in that workflow run's logs/summary.
        required: true
        type: string

permissions:
  contents: write

env:
  IMAGE_API: scholtz2/avm-trade-reporter
  IMAGE_SUBSCRIBER: scholtz2/avm-trade-reporter-subscriber
  NAMESPACE: biatec-scan

jobs:
  # ---------------------------------------------------------------------
  # Stage 1: promote-tag - re-tags the already-built & pushed
  # <image>:<version> images as :latest. Doesn't rebuild anything - just
  # moves the "latest" pointer.
  # ---------------------------------------------------------------------
  promote-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull versioned images
        run: |
          docker pull ${{ env.IMAGE_API }}:${{ inputs.version }}
          docker pull ${{ env.IMAGE_SUBSCRIBER }}:${{ inputs.version }}

      - name: Tag & push API latest
        run: |
          docker tag ${{ env.IMAGE_API }}:${{ inputs.version }} ${{ env.IMAGE_API }}:latest
          docker push ${{ env.IMAGE_API }}:latest

      - name: Tag & push Subscriber latest
        run: |
          docker tag ${{ env.IMAGE_SUBSCRIBER }}:${{ inputs.version }} ${{ env.IMAGE_SUBSCRIBER }}:latest
          docker push ${{ env.IMAGE_SUBSCRIBER }}:latest

  # ---------------------------------------------------------------------
  # Stage 2: deploy-production - only runs once the "production" GitHub
  # Environment's protection rules (e.g. required reviewers) are satisfied.
  # Deploys the version pinned by the input, not the "latest" tag, so the
  # committed manifest always records exactly which build is running.
  # ---------------------------------------------------------------------
  deploy-production:
    name: Deploy to production (mainnet)
    needs: promote-tag
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.algorand.scan.biatec.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update production manifests with new image tags
        run: |
          version="${{ inputs.version }}"
          sed -i "s~${IMAGE_API}.*~${IMAGE_API}:${version}~g" k8s/main/deployment-api.yaml
          sed -i "s~${IMAGE_API}.*~${IMAGE_API}:${version}~g" k8s/main/deployment2-api.yaml
          sed -i "s~${IMAGE_SUBSCRIBER}.*~${IMAGE_SUBSCRIBER}:${version}~g" k8s/main/subscriber-deployment.yaml

      - name: Commit updated production manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- k8s/main/deployment-api.yaml k8s/main/deployment2-api.yaml k8s/main/subscriber-deployment.yaml; then
            git add k8s/main/deployment-api.yaml k8s/main/deployment2-api.yaml k8s/main/subscriber-deployment.yaml
            git commit -m "cicd promote ${{ inputs.version }} to production [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin master && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep $((i * 3))
            done
          else
            echo "No manifest changes to commit"
          fi

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      # Must run BEFORE "Apply Kubernetes manifests": on a freshly scheduled Pod, kubectl apply
      # schedules Pods immediately, so if the ConfigMap a Pod's volume mounts doesn't exist yet, the
      # Pod fails to start. Using `apply` (dry-run client -> apply) instead of delete+create means
      # there's never a window where the ConfigMap doesn't exist at all.
      - name: Update production config map
        run: |
          kubectl create configmap avm-trade-reporter-main-conf --from-file=k8s/main/conf-api -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      # avm-trade-reporter-images-pvc is the shared icon cache volume mounted by both production
      # API deployments below (see k8s/main/pv-images.yaml header comment). It must exist before
      # they're applied, or their Pods stay stuck Pending with "persistentvolumeclaim ... not
      # found".
      - name: Apply shared images PV/PVC
        run: |
          kubectl apply -f k8s/main/pv-images.yaml -n "$NAMESPACE"

      - name: Apply Kubernetes manifests (production)
        run: |
          kubectl apply -f k8s/main/deployment-api.yaml -n "$NAMESPACE"
          kubectl apply -f k8s/main/deployment2-api.yaml -n "$NAMESPACE"
          kubectl apply -f k8s/main/subscriber-deployment.yaml -n "$NAMESPACE"

      - name: Roll out production deployments
        run: |
          kubectl rollout restart deployment/avm-trade-reporter-app-deployment -n "$NAMESPACE"
          kubectl rollout status deployment/avm-trade-reporter-app-deployment -n "$NAMESPACE"
          kubectl rollout restart deployment/avm-trade-reporter2-app-deployment -n "$NAMESPACE"
          kubectl rollout status deployment/avm-trade-reporter2-app-deployment -n "$NAMESPACE"
          kubectl rollout restart deployment/avmtradereporter-subscriber -n "$NAMESPACE"
          kubectl rollout status deployment/avmtradereporter-subscriber -n "$NAMESPACE"

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$HOME/.kube/config"
