name: Promote to Production

# Manual-only pipeline. Run this once a version has been built by "Build and Deploy" (deploy.yml) and
# verified on stage. The backend image is network-agnostic (all network specifics come from the
# per-environment ConfigMap/Secret), so the same image is promoted to whichever production network
# is selected: "algorand" (k8s/main/*, api.algorand.scan.biatec.io - also re-tags the images as
# :latest) or "voi" (k8s/voi/*, api.voi.scan.biatec.io, Voi mainnet). Selecting "all" promotes the
# same version to every production network (algorand + voi) in one run, each deploy still gated by
# its own GitHub Environment. On network=all, voi deploys only after the algorand :latest tag has
# been promoted (deploy-production-voi waits on promote-tag) rather than in parallel with algorand.
# It never builds a new image.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version string to promote, exactly as produced by the "build" job in deploy.yml
          (e.g. 1.2026.08.07-main). Find it in that workflow run's logs/summary. Leave empty to
          promote the newest stage build (looked up in Docker Hub).
        required: false
        default: ""
        type: string
      network:
        description: >-
          Production network to deploy to. "all" deploys the same version to
          every production network (algorand + voi) and is the default - the
          two networks previously drifted apart (e.g. 1.2026.08.11-main went
          to algorand only, leaving voi a version behind) whenever someone
          promoted a single network and forgot the other. Only pick a single
          network deliberately, e.g. to hotfix one production independently.
        required: true
        default: all
        type: choice
        options:
          - algorand
          - voi
          - all
      skip_stage_verification:
        description: >-
          Emergency only: promote without requiring that stage runs exactly this version and passes the GeckoTerminal
          conformance suite. Leave unchecked - the gate exists so that a version that breaks the CoinGecko integration
          never reaches mainnet.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  IMAGE_API: scholtz2/avm-trade-reporter
  IMAGE_SUBSCRIBER: scholtz2/avm-trade-reporter-subscriber
  NAMESPACE: biatec-scan

jobs:
  # ---------------------------------------------------------------------
  # Stage 0: resolve-version - uses the supplied version as-is, or, when
  # none was given, finds the newest versioned stage build in Docker Hub.
  # deploy.yml tags every stage build as 1.<year>.<month>.<day>-main, so
  # the most recently pushed *-main tag is exactly what's on stage now.
  # ---------------------------------------------------------------------
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version to promote
        id: resolve
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            echo "No version supplied - looking up the newest stage build in Docker Hub"
            version=$(curl -fsSL "https://hub.docker.com/v2/repositories/${IMAGE_API}/tags?page_size=100&ordering=last_updated" \
              | jq -r '.results[].name' \
              | grep -E '^1\..+-main$' \
              | head -n 1)
          fi
          if [ -z "$version" ]; then
            echo "::error::Could not resolve a version to promote (no versioned *-main tag found in Docker Hub)"
            exit 1
          fi
          echo "Promoting version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Only meaningful when a single network is being promoted (network=all keeps both in
      # lockstep by construction). Reads what's currently committed for the network NOT being
      # promoted this run and warns - doesn't block - if it's about to fall further out of sync,
      # so a deliberate single-network hotfix doesn't silently repeat the 2026-08-11 drift
      # (algorand promoted to 1.2026.08.11-main, voi left on 1.2026.08.10-main until the next day).
      - name: Checkout
        if: inputs.network != 'all'
        uses: actions/checkout@v4

      - name: Warn if this leaves networks on different versions
        if: inputs.network != 'all'
        run: |
          version="${{ steps.resolve.outputs.version }}"
          if [ "${{ inputs.network }}" = "algorand" ]; then
            other_name="voi"
            other_version=$(grep -oE "${IMAGE_API}:[^\"[:space:]]+" k8s/voi/deployment-api-voi.yaml | head -n1 | cut -d: -f2)
          else
            other_name="algorand"
            other_version=$(grep -oE "${IMAGE_API}:[^\"[:space:]]+" k8s/main/deployment-api.yaml | head -n1 | cut -d: -f2)
          fi
          if [ -n "$other_version" ] && [ "$other_version" != "$version" ]; then
            echo "::warning::Promoting only '${{ inputs.network }}' to $version - '$other_name' stays on $other_version. Re-run with network=all to keep both in sync."
          fi

  # ---------------------------------------------------------------------
  # Stage 0b: verify-stage - the safety gate against breaking the GeckoTerminal / CoinGecko integration on mainnet.
  # 1. stage must run EXACTLY the version being promoted (the manifest in the repo records what the stage rollout
  #    deployed), otherwise stage's green result says nothing about this version;
  # 2. the live conformance suite (schema, gaps, golden data, latency, load) must pass against stage right now.
  # The suite is the same one that runs after every stage deploy and that smoke-tests production after promotion.
  # See docs/GECKOTERMINAL.md.
  # ---------------------------------------------------------------------
  verify-stage:
    name: Verify GeckoTerminal integration on stage
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Stage must run the version being promoted
        run: |
          version="${{ needs.resolve-version.outputs.version }}"
          staged=$(grep -oE "${IMAGE_API}:[^\"[:space:]]+" k8s/stage/deployment-api-stage.yaml | head -n1 | cut -d: -f2)
          echo "promoting: $version / stage runs: $staged"
          if [ "${{ inputs.skip_stage_verification }}" = "true" ]; then
            echo "::warning::skip_stage_verification is set - promoting $version without proving it on stage"
          elif [ "$staged" != "$version" ]; then
            echo "::error::Stage runs '$staged', not '$version'. Promote the version stage verified, or deploy $version to stage first (push to master / run Build and Deploy) and let it pass."
            exit 1
          fi

      - name: Live conformance suite against stage
        if: ${{ !inputs.skip_stage_verification }}
        uses: ./.github/actions/geckoterminal-conformance
        with:
          base_url: https://api.testnet.scan.biatec.io
          golden: testnet
          latency_factor: "2"
          poll_seconds: "60"

  # ---------------------------------------------------------------------
  # Stage 1: verify-images - the versioned tag was pushed by deploy.yml when
  # this build went to stage, but that doesn't guarantee it's still there or
  # that it finished pushing (e.g. an explicit --version input for a build
  # that's still in flight). Both production deploys must only proceed once
  # this is confirmed - previously only the algorand path got this check for
  # free as a side effect of promote-tag's "docker pull"; voi had no such
  # guard and would only fail late, via a stuck rollout, if the image was
  # missing.
  # ---------------------------------------------------------------------
  verify-images:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Confirm versioned images exist in the registry
        run: |
          version="${{ needs.resolve-version.outputs.version }}"
          docker manifest inspect "${{ env.IMAGE_API }}:${version}" > /dev/null
          docker manifest inspect "${{ env.IMAGE_SUBSCRIBER }}:${version}" > /dev/null

  # ---------------------------------------------------------------------
  # Stage 2: promote-tag - re-tags the already-built & pushed
  # <image>:<version> images as :latest. Doesn't rebuild anything - just
  # moves the "latest" pointer. The ":latest" moving tag means "what runs
  # on Algorand production", so this only runs when Algorand is being
  # promoted (network=algorand or all); the voi deployment always pins
  # the exact versioned tag in its manifests.
  # ---------------------------------------------------------------------
  promote-tag:
    needs: [resolve-version, verify-images, verify-stage]
    if: inputs.network == 'algorand' || inputs.network == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull versioned images
        run: |
          docker pull ${{ env.IMAGE_API }}:${{ needs.resolve-version.outputs.version }}
          docker pull ${{ env.IMAGE_SUBSCRIBER }}:${{ needs.resolve-version.outputs.version }}

      - name: Tag & push API latest
        run: |
          docker tag ${{ env.IMAGE_API }}:${{ needs.resolve-version.outputs.version }} ${{ env.IMAGE_API }}:latest
          docker push ${{ env.IMAGE_API }}:latest

      - name: Tag & push Subscriber latest
        run: |
          docker tag ${{ env.IMAGE_SUBSCRIBER }}:${{ needs.resolve-version.outputs.version }} ${{ env.IMAGE_SUBSCRIBER }}:latest
          docker push ${{ env.IMAGE_SUBSCRIBER }}:latest

  # ---------------------------------------------------------------------
  # Stage 3: deploy-production - only runs once the "production" GitHub
  # Environment's protection rules (e.g. required reviewers) are satisfied.
  # Deploys the version pinned by the input, not the "latest" tag, so the
  # committed manifest always records exactly which build is running.
  # ---------------------------------------------------------------------
  deploy-production:
    name: Deploy to production (Algorand mainnet)
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    needs: [resolve-version, verify-images, promote-tag, verify-stage]
    if: inputs.network == 'algorand' || inputs.network == 'all'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.algorand.scan.biatec.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # kubectl + KUBE_CONFIG + credential check: fails here, before anything is applied, when the cluster rejects
      # the deployer credential (see docs/CICD_GITHUB_ACTIONS.md, "Deployer credentials")
      - name: Kubernetes deployer setup
        uses: ./.github/actions/kube-setup
        with:
          kube-config: ${{ secrets.KUBE_CONFIG }}
          namespace: ${{ env.NAMESPACE }}
          can-i: patch deployments.apps/avm-trade-reporter-app-deployment

      - name: Update production manifests with new image tags
        run: |
          version="${{ needs.resolve-version.outputs.version }}"
          bash scripts/set-image-tags.sh "$version" k8s/main/deployment-api.yaml k8s/main/deployment2-api.yaml k8s/main/subscriber-deployment.yaml

      # Must run BEFORE "Apply Kubernetes manifests": on a freshly scheduled Pod, kubectl apply
      # schedules Pods immediately, so if the ConfigMap a Pod's volume mounts doesn't exist yet, the
      # Pod fails to start. Using `apply` (dry-run client -> apply) instead of delete+create means
      # there's never a window where the ConfigMap doesn't exist at all.
      - name: Update production config map
        run: |
          kubectl create configmap avm-trade-reporter-main-conf --from-file=k8s/main/conf-api -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      # avm-trade-reporter-images-pvc is the shared icon cache volume mounted by both production
      # API deployments below (see k8s/main/pv-images.yaml header comment). It must exist before
      # they're applied, or their Pods stay stuck Pending with "persistentvolumeclaim ... not
      # found".
      - name: Apply shared images PV/PVC
        run: |
          kubectl apply -f k8s/main/pv-images.yaml -n "$NAMESPACE"

      - name: Apply Kubernetes manifests (production)
        id: apply
        run: |
          # server-side dry run first: a forbidden or invalid manifest fails here, before the cluster changed
          kubectl apply --dry-run=server -n "$NAMESPACE" -f k8s/main/deployment-api.yaml -f k8s/main/deployment2-api.yaml -f k8s/main/subscriber-deployment.yaml
          kubectl apply -f k8s/main/deployment-api.yaml -n "$NAMESPACE"
          # the cluster changed: from here on the commit step records the version (also if a later apply fails)
          echo "applied=true" >> "$GITHUB_OUTPUT"
          kubectl apply -f k8s/main/deployment2-api.yaml -n "$NAMESPACE"
          kubectl apply -f k8s/main/subscriber-deployment.yaml -n "$NAMESPACE"

      - name: Roll out production deployments
        run: |
          kubectl rollout restart deployment/avm-trade-reporter-app-deployment -n "$NAMESPACE"
          kubectl rollout status deployment/avm-trade-reporter-app-deployment -n "$NAMESPACE"
          kubectl rollout restart deployment/avm-trade-reporter2-app-deployment -n "$NAMESPACE"
          kubectl rollout status deployment/avm-trade-reporter2-app-deployment -n "$NAMESPACE"
          kubectl rollout restart deployment/avmtradereporter-subscriber -n "$NAMESPACE"
          kubectl rollout status deployment/avmtradereporter-subscriber -n "$NAMESPACE"

      # after the rollout (always watched), whenever the manifests were applied: master shows the spec the cluster
      # got, also when the rollout failed - see .github/actions/commit-manifests
      - name: Commit updated production manifests
        if: always() && steps.apply.outputs.applied == 'true'
        uses: ./.github/actions/commit-manifests
        with:
          files: k8s/main/deployment-api.yaml k8s/main/deployment2-api.yaml k8s/main/subscriber-deployment.yaml
          version: ${{ needs.resolve-version.outputs.version }}
          message: "cicd promote ${{ needs.resolve-version.outputs.version }} to production [skip ci]"

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$HOME/.kube/config"

  # ---------------------------------------------------------------------
  # Stage 3 (voi): deploy-production-voi - Voi mainnet production
  # (api.voi.scan.biatec.io, k8s/voi/*). Gated by the "production-voi"
  # GitHub Environment, whose secrets must provide the Voi environment's
  # own Elasticsearch cluster (ELASTIC_HOST/ELASTIC_API_KEY - index names
  # are not namespaced per environment, so voi cannot share production's
  # cluster) and REDIS_CONNECTION_STRING (may be the shared Redis - keys
  # are namespaced avmtrade:voi:* / voi:*). Deploys the exact same pinned
  # versioned tag as deploy-production (both read needs.resolve-version's
  # single output) once verify-images has confirmed it exists. Also waits
  # on promote-tag so a network=all run always finishes tagging :latest
  # for algorand before voi starts rolling out - that ordering itself has
  # no functional bearing on the voi deploy (it pins the exact versioned
  # tag, not :latest), it's purely so the two production networks don't
  # go out simultaneously. promote-tag is skipped entirely for a
  # network=voi-only run, so the `if` below also accepts a "skipped"
  # result - `needs:` alone would otherwise skip this job too.
  # ---------------------------------------------------------------------
  deploy-production-voi:
    name: Deploy to production (Voi mainnet)
    concurrency:
      group: deploy-production-voi
      cancel-in-progress: false
    needs: [resolve-version, verify-images, promote-tag, verify-stage]
    if: |
      (inputs.network == 'voi' || inputs.network == 'all') &&
      (needs.promote-tag.result == 'success' || needs.promote-tag.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: production-voi
      url: https://api.voi.scan.biatec.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # kubectl + KUBE_CONFIG + credential check: fails here, before anything is applied, when the cluster rejects
      # the deployer credential (see docs/CICD_GITHUB_ACTIONS.md, "Deployer credentials")
      - name: Kubernetes deployer setup
        uses: ./.github/actions/kube-setup
        with:
          kube-config: ${{ secrets.KUBE_CONFIG }}
          namespace: ${{ env.NAMESPACE }}
          can-i: patch deployments.apps/avm-trade-reporter-voi-app-deployment

      - name: Update voi manifests with new image tags
        run: |
          version="${{ needs.resolve-version.outputs.version }}"
          bash scripts/set-image-tags.sh "$version" k8s/voi/deployment-api-voi.yaml k8s/voi/subscriber-deployment-voi.yaml

      # Voi's Elastic/Redis credentials live only as GitHub Environment secrets ("production-voi"),
      # never committed to the repo. Re-created on every promote so rotating a GitHub secret and
      # re-running the workflow is enough to rotate the deployed value (same pattern as stage).
      - name: Update voi secrets from GitHub secrets
        run: |
          kubectl create secret generic avm-trade-reporter-voi-secret \
            --namespace="$NAMESPACE" \
            --from-literal=AppConfiguration__Elastic__Host="$ELASTIC_HOST" \
            --from-literal=AppConfiguration__Elastic__ApiKey="$ELASTIC_API_KEY" \
            --from-literal=AppConfiguration__Redis__ConnectionString="$REDIS_CONNECTION_STRING" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic avm-trade-reporter-subscriber-voi-secret \
            --namespace="$NAMESPACE" \
            --from-literal=REDIS_CONNECTION="$REDIS_CONNECTION_STRING" \
            --dry-run=client -o yaml | kubectl apply -f -
        env:
          ELASTIC_HOST: ${{ secrets.ELASTIC_HOST }}
          ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
          REDIS_CONNECTION_STRING: ${{ secrets.REDIS_CONNECTION_STRING }}

      # Must run BEFORE the manifests are applied - see the equivalent comment in the Algorand
      # production job above.
      - name: Update voi config map
        run: |
          kubectl create configmap avm-trade-reporter-voi-main-conf --from-file=k8s/voi/conf-api-voi -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests (voi)
        id: apply
        run: |
          # server-side dry run first: a forbidden or invalid manifest fails here, before the cluster changed
          kubectl apply --dry-run=server -n "$NAMESPACE" -f k8s/voi/deployment-api-voi.yaml -f k8s/voi/subscriber-deployment-voi.yaml
          # its API pods mount the shared icon cache, which only an admin can create (production's PV/PVC manifest):
          # fail here, not after a 20-minute rollout of Pending pods
          if ! kubectl get pvc avm-trade-reporter-images-pvc -n "$NAMESPACE" -o name >/dev/null; then
            echo "::error::PVC avm-trade-reporter-images-pvc is missing in $NAMESPACE - an admin must apply k8s/main/pv-images.yaml"
            exit 1
          fi
          kubectl apply -f k8s/voi/deployment-api-voi.yaml -n "$NAMESPACE"
          # the cluster changed: from here on the commit step records the version (also if a later apply fails)
          echo "applied=true" >> "$GITHUB_OUTPUT"
          kubectl apply -f k8s/voi/subscriber-deployment-voi.yaml -n "$NAMESPACE"

      - name: Roll out voi deployments
        run: |
          kubectl rollout restart deployment/avm-trade-reporter-voi-app-deployment -n "$NAMESPACE"
          kubectl rollout status deployment/avm-trade-reporter-voi-app-deployment -n "$NAMESPACE"
          kubectl rollout restart deployment/avmtradereporter-subscriber-voi -n "$NAMESPACE"
          kubectl rollout status deployment/avmtradereporter-subscriber-voi -n "$NAMESPACE"

      # after the rollout (always watched), whenever the manifests were applied: master shows the spec the cluster
      # got, also when the rollout failed - see .github/actions/commit-manifests
      - name: Commit updated voi manifests
        if: always() && steps.apply.outputs.applied == 'true'
        uses: ./.github/actions/commit-manifests
        with:
          files: k8s/voi/deployment-api-voi.yaml k8s/voi/subscriber-deployment-voi.yaml
          version: ${{ needs.resolve-version.outputs.version }}
          message: "cicd promote ${{ needs.resolve-version.outputs.version }} to production-voi [skip ci]"

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$HOME/.kube/config"

  # ---------------------------------------------------------------------
  # Stage 4: smoke-production - the same live suite against the freshly rolled-out production API. The deploy job already
  # waited for the rollouts (kubectl rollout status), so the pods are warm. A failure here means GeckoTerminal may already
  # be receiving bad data: ROLL BACK at once -
  #   kubectl rollout undo deployment/avm-trade-reporter-app-deployment -n biatec-scan   (and ...2-app-deployment)
  # and set the repository variable GECKOTERMINAL_MAINNET_LIVE only after a green run.
  # ---------------------------------------------------------------------
  smoke-production:
    name: Smoke test production (Algorand mainnet)
    needs: deploy-production
    if: ${{ always() && needs.deploy-production.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: ./.github/actions/geckoterminal-conformance
        with:
          base_url: https://api.algorand.scan.biatec.io
          golden: mainnet
          expect_events: "true"
          latency_factor: "2"
          wait_minutes: "10"
      - name: How to roll back
        if: failure()
        run: |
          echo "::error::The GeckoTerminal conformance suite FAILED on production after the promotion. Roll back: kubectl rollout undo deployment/avm-trade-reporter-app-deployment -n biatec-scan; kubectl rollout undo deployment/avm-trade-reporter2-app-deployment -n biatec-scan"

  smoke-production-voi:
    name: Smoke test production (Voi mainnet)
    needs: deploy-production-voi
    if: ${{ always() && needs.deploy-production-voi.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: ./.github/actions/geckoterminal-conformance
        with:
          base_url: https://api.voi.scan.biatec.io
          expect_events: "false"
          latency_factor: "2"
          wait_minutes: "10"
