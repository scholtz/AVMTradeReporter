name: Build and Deploy

# Replaces the old SSH-triggered flow (deploy-trade-reporter.sh running on the staging host, which did
# `docker build`/`docker push` + `kubectl apply` locally over an SSH session). This workflow does the
# same work natively in GitHub Actions: build both images here, push them to Docker Hub, and apply the
# Kubernetes manifests directly from the runner via a kubeconfig secret. Image naming/tag scheme is
# unchanged from the old deploy-trade-reporter.sh: 1.<year>.<month>.<day>-main.
#
# Every push to master builds both images once and deploys them to the stage environment (k8s/stage/*,
# testnet). Production is NOT deployed from here - promoting a built version to production is a manual,
# separate action. See promote-production.yml, which is triggered by hand once a version has been
# verified on stage; it re-tags that version's already-pushed images as "latest" and deploys them to
# k8s/main/* (mainnet). See docs/CICD_GITHUB_ACTIONS.md for the full list of required secrets and
# docs/STAGE_ENVIRONMENT.md for what stage is and how it differs from production.
on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: write

env:
  IMAGE_API: scholtz2/avm-trade-reporter
  IMAGE_SUBSCRIBER: scholtz2/avm-trade-reporter-subscriber
  NAMESPACE: biatec-scan

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same versioning scheme historically used by deploy-trade-reporter.sh / compose.sh:
      # 1.<year>.<month>.<day>-main. Both images always share this one tag.
      - name: Compute version
        id: version
        run: |
          ver="1.$(date -u '+%Y').$(date -u '+%m').$(date -u '+%d')"
          version="$ver-main"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Computed version: $version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: AVMTradeReporter/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.IMAGE_API }}:${{ steps.version.outputs.version }}

      - name: Build and push Subscriber image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: AVMTradeReporter.Subscriber/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.IMAGE_SUBSCRIBER }}:${{ steps.version.outputs.version }}

  deploy-stage:
    name: Deploy to stage (testnet)
    concurrency:
      group: deploy-stage
      cancel-in-progress: false
    needs: build
    runs-on: ubuntu-latest
    # Scoped to the "stage" GitHub Environment - ELASTIC_HOST/ELASTIC_API_KEY/REDIS_CONNECTION_STRING
    # below are defined ONLY inside this environment (Settings -> Environments -> stage -> Secrets), so
    # they can never be referenced by the production job by mistake. See docs/CICD_GITHUB_ACTIONS.md.
    environment:
      name: stage
      url: https://testnet.scan.biatec.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # kubectl + KUBE_CONFIG + credential check: fails here, before anything is applied, when the cluster rejects
      # the deployer credential (see docs/CICD_GITHUB_ACTIONS.md, "Deployer credentials")
      - name: Kubernetes deployer setup
        uses: ./.github/actions/kube-setup
        with:
          kube-config: ${{ secrets.KUBE_CONFIG }}
          namespace: ${{ env.NAMESPACE }}
          can-i: patch deployments.apps/avm-trade-reporter-stage-app-deployment

      - name: Update stage manifests with new image tags
        run: |
          version="${{ needs.build.outputs.version }}"
          bash scripts/set-image-tags.sh "$version" k8s/stage/deployment-api-stage.yaml k8s/stage/subscriber-deployment-stage.yaml

      # before ANY change to the cluster: a server-side dry run of the manifests (a forbidden or invalid object fails
      # here), and the Secrets / ConfigMap the next steps patch plus the shared icon cache the API pods mount must exist
      # (the deployers cannot create objects) - fail now, not half-way or after a 20-minute rollout of Pending pods
      - name: Preflight manifests
        run: |
          kubectl apply --dry-run=server -n "$NAMESPACE" -f k8s/stage/deployment-api-stage.yaml -f k8s/stage/subscriber-deployment-stage.yaml
          bash scripts/check-objects.sh patch:secrets/avm-trade-reporter-stage-secret \
            patch:secrets/avm-trade-reporter-subscriber-stage-secret patch:configmaps/avm-trade-reporter-stage-main-conf \
            get:persistentvolumeclaims/avm-trade-reporter-images-pvc

      # Stage's Elastic/Redis credentials live only as GitHub secrets, never committed to the repo.
      # This step (re-)creates the Secret from those GitHub secrets on every deploy, so rotating a
      # GitHub secret and re-running the workflow is enough to rotate the deployed value - no manual
      # kubectl step needed, unlike production's secrets which are managed by hand outside this repo.
      - name: Update stage secret from GitHub secrets
        run: |
          kubectl create secret generic avm-trade-reporter-stage-secret \
            --namespace="$NAMESPACE" \
            --from-literal=AppConfiguration__Elastic__Host="$ELASTIC_HOST" \
            --from-literal=AppConfiguration__Elastic__ApiKey="$ELASTIC_API_KEY" \
            --from-literal=AppConfiguration__Redis__ConnectionString="$REDIS_CONNECTION_STRING" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic avm-trade-reporter-subscriber-stage-secret \
            --namespace="$NAMESPACE" \
            --from-literal=REDIS_CONNECTION="$REDIS_CONNECTION_STRING" \
            --dry-run=client -o yaml | kubectl apply -f -
        env:
          ELASTIC_HOST: ${{ secrets.ELASTIC_HOST }}
          ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
          REDIS_CONNECTION_STRING: ${{ secrets.REDIS_CONNECTION_STRING }}

      - name: Update stage config map
        run: |
          kubectl create configmap avm-trade-reporter-stage-main-conf --from-file=k8s/stage/conf-api-stage -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests (stage)
        run: |
          kubectl apply -f k8s/stage/deployment-api-stage.yaml -n "$NAMESPACE"
          kubectl apply -f k8s/stage/subscriber-deployment-stage.yaml -n "$NAMESPACE"

      - name: Roll out stage deployments
        run: |
          kubectl rollout restart deployment/avm-trade-reporter-stage-app-deployment -n "$NAMESPACE"
          kubectl rollout status deployment/avm-trade-reporter-stage-app-deployment -n "$NAMESPACE"
          kubectl rollout restart deployment/avmtradereporter-subscriber-stage -n "$NAMESPACE"
          kubectl rollout status deployment/avmtradereporter-subscriber-stage -n "$NAMESPACE"

      # only after a SUCCESSFUL rollout: promote-production's gate reads master's stage manifest as "stage runs this
      # version". After a failed rollout the old pods keep serving, and master keeps saying so.
      - name: Commit updated stage manifests
        # only a deploy of master records on master: a workflow_dispatch from another branch does not write its build
        # into master's stage record (note: it still pushes that day's tag - see docs, "Deployer credentials")
        if: github.ref == 'refs/heads/master'
        uses: ./.github/actions/commit-manifests
        with:
          files: k8s/stage/deployment-api-stage.yaml k8s/stage/subscriber-deployment-stage.yaml
          version: ${{ needs.build.outputs.version }}
          message: "cicd deploy ${{ needs.build.outputs.version }} to stage [skip ci]"
          forward-only: "true"

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$HOME/.kube/config"

  # After every stage deploy: prove the GeckoTerminal integration on the freshly rolled-out stage pods (schema, gaps,
  # latency, golden data). A red run means this version must NOT be promoted - promote-production.yml re-checks stage as
  # its gate. See docs/GECKOTERMINAL.md.
  verify-stage:
    name: Verify GeckoTerminal integration on stage
    needs: deploy-stage
    uses: ./.github/workflows/geckoterminal-conformance.yml
    with:
      base_url: https://api.testnet.scan.biatec.io
      golden: testnet
      latency_factor: "2"
