# Weekly check of the deployer credential (KUBE_CONFIG) of the deploy environments, so an expiring or revoked
# credential shows up as a failed scheduled run - with the reason and the fix - instead of as a broken deploy weeks
# later (the stage deploy failed silently from 2026-10-18 to 2026-11-12 because the credential had expired).
#
# `production` is not checked here: it requires a reviewer, so a scheduled job would wait for an approval every
# week. Its promote job runs the same check (scripts/check-kubeconfig.sh) before it deploys.
name: Kubernetes deployer credentials

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Check KUBE_CONFIG (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [stage, production-voi]
    environment:
      name: ${{ matrix.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      # fails when the cluster rejects the credential, and also 14 days before it expires
      - name: Check cluster credentials
        run: bash scripts/check-kubeconfig.sh --namespace biatec-scan --warn-days 14 --fail-on-warn

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$HOME/.kube/config"
