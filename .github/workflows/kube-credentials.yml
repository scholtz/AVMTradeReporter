# Weekly check of the deployer credential (KUBE_CONFIG) of the deploy environments, so an expiring or revoked
# credential shows up as a failed scheduled run - with the reason and the fix - instead of as a broken deploy weeks
# later (the stage deploy failed silently from 2026-10-18 to 2026-11-12 because the credential had expired).
#
# `production` is not checked here: it requires a reviewer, so a scheduled job would wait for an approval every
# week (`production-voi` has no protection rule - if it gets one, drop it from the matrix too). Its promote job runs the same check (scripts/check-kubeconfig.sh) before it deploys.
name: Kubernetes deployer credentials

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NAMESPACE: biatec-scan # as in deploy.yml / promote-production.yml

jobs:
  check:
    name: Check KUBE_CONFIG (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: stage
            deployment: avm-trade-reporter-stage-app-deployment
          - environment: production-voi
            deployment: avm-trade-reporter-voi-app-deployment
    environment:
      name: ${{ matrix.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # fails when the cluster rejects the credential, and also 14 days before it expires
      - name: Kubernetes deployer setup
        uses: ./.github/actions/kube-setup
        with:
          kube-config: ${{ secrets.KUBE_CONFIG }}
          namespace: ${{ env.NAMESPACE }}
          can-i: patch deployments.apps/${{ matrix.deployment }}
          check-args: --warn-days 14 --fail-on-warn

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$HOME/.kube/config"
