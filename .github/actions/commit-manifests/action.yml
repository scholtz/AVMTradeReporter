# Records the image version a deploy job applied in the manifests on master, so master shows what the cluster got.
#
# Run it after the rollout step with `if: always() && steps.apply.outcome == 'success'`: the rollout is always
# watched (a push problem can no longer skip `kubectl rollout status`), and master records the applied version also
# when the rollout failed. The change is re-applied with scripts/set-image-tags.sh on a fresh worktree of
# origin/master - not rebased, not copied - so another deploy's commit to the same image line cannot leave a
# conflicted rebase behind, and other edits to those manifests that landed on master meanwhile are kept. A push that
# still fails after the retries fails the step.
name: Commit deployed manifests
description: Records the applied image version in the manifests on master (fresh worktree, retried, fails loudly).
inputs:
  files:
    description: Space separated manifest paths
    required: true
  version:
    description: The image version that was applied
    required: true
  message:
    description: Commit message
    required: true
runs:
  using: composite
  steps:
    - name: Commit and push the deployed manifests
      shell: bash
      env:
        FILES: ${{ inputs.files }}
        VERSION: ${{ inputs.version }}
        MESSAGE: ${{ inputs.message }}
      run: |
        set -euo pipefail
        read -r -a files <<< "$FILES"
        set_tags="$GITHUB_WORKSPACE/scripts/set-image-tags.sh"
        worktree=$(mktemp -d)
        trap 'git worktree remove --force "$worktree" >/dev/null 2>&1 || true' EXIT
        for attempt in 1 2 3 4 5; do
          git fetch --quiet origin master
          git worktree remove --force "$worktree" >/dev/null 2>&1 || true
          git worktree add --quiet --detach "$worktree" origin/master
          (cd "$worktree" && bash "$set_tags" "$VERSION" "${files[@]}")
          if git -C "$worktree" diff --quiet -- "${files[@]}"; then
            echo "master already records version $VERSION"
            exit 0
          fi
          git -C "$worktree" -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "$MESSAGE" -- "${files[@]}"
          if git -C "$worktree" push --quiet origin HEAD:master; then
            echo "Committed: $MESSAGE"
            exit 0
          fi
          echo "Push attempt $attempt failed, retrying on a fresh master..."
          sleep $((attempt * 3))
        done
        echo "::error::Could not push the deployed manifests to master - master does not show the version applied to the cluster."
        exit 1
