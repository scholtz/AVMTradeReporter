# Voi counterpart of k8s/main/subscriber-deployment.yaml - subscribes to the Voi API's Redis
# pub/sub channels (avmtrade:voi:*, distinct from production's avmtrade:* and stage's
# avmtrade:stage:* channels/key prefixes so they can never cross-talk even if all point at the
# same Redis instance). Deployed by promote-production.yml with network=voi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avmtradereporter-subscriber-voi
  namespace: biatec-scan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: avmtradereporter-subscriber-voi
  template:
    metadata:
      labels:
        app: avmtradereporter-subscriber-voi
    spec:
      containers:
        - name: subscriber
          image: scholtz2/avm-trade-reporter-subscriber:1.2026.08.22-main
          env:
            - name: POOL_CHANNEL
              value: "avmtrade:voi:pool:updates"
            - name: AGGREGATED_POOL_CHANNEL
              value: "avmtrade:voi:aggregatedpool:updates"
            - name: POOL_KEY_PREFIX
              value: "avmtrade:voi:pools:"
            - name: AGGREGATED_POOL_KEY_PREFIX
              value: "avmtrade:voi:aggregatedpools:"
          envFrom:
            # Dedicated voi secret (REDIS_CONNECTION only), re-created on every promote from the
            # "production-voi" GitHub environment secrets - see promote-production.yml.
            - secretRef:
                name: avm-trade-reporter-subscriber-voi-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      restartPolicy: Always
