apiVersion: apps/v1
kind: Deployment
metadata:
  name: avm-trade-reporter-app-deployment
  namespace: biatec-scan
spec:
  selector:
    matchLabels:
      app: avm-trade-reporter-app
  replicas: 1
  # Explicit zero-downtime rollout: surge a second pod running the new image and wait for it to
  # pass readiness (which, with startupProbe/readinessProbe above, only happens once every static
  # cache is fully warm) before the old pod is torn down - maxUnavailable: 0 forbids ever dropping
  # to zero ready pods. minReadySeconds adds a short soak so a pod that flaps right after passing
  # readiness doesn't get treated as available.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 15
  # kubectl rollout status (used by promote-production.yml) reports failure once this many
  # seconds pass without progress - default is 600s (10 min). Production's real pool count
  # (3000+) made a from-cold startup take longer than that even after parallelizing the bulk
  # warmup (2026-08-13/14 incident: "deployment ... exceeded its progress deadline" while the
  # new pod was still legitimately starting, not stuck). Must stay comfortably above
  # startupProbe's own budget below.
  progressDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app: avm-trade-reporter-app
    spec:
      containers:
        - name: avm-trade-reporter-app
          image: scholtz2/avm-trade-reporter:1.2026.08.22-main
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 200m
              memory: "200Mi"
            limits:
              cpu: 4000m
              memory: "4000Mi"
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: avm-trade-reporter-secret
          # Startup can legitimately take minutes: Program.cs blocks Kestrel's port bind on
          # loading/hydrating every static in-memory cache (assets, pools, aggregated pools incl.
          # their derived PriceUSD/TVL/PoolsCount/Volume figures) so a freshly-rolled pod never
          # looks "ready" to Kubernetes with incomplete data. While that port is closed, all three
          # probes below fail identically and, without a startupProbe, the liveness probe's short
          # failureThreshold could kill the pod mid-warmup - producing an endless restart loop that
          # never finishes preloading. startupProbe suppresses liveness/readiness checks until it
          # passes once. All three probe /health (see HealthChecks/ + Program.cs MapHealthChecks),
          # which only returns 200 once ES/Redis/asset-cache/pool-cache checks are Healthy/Degraded
          # (503 = Unhealthy) - a real application-level signal, not just "the TCP port is open".
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 180 # up to ~15 minutes to finish warmup before liveness can kill it
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            # Give in-flight requests/SignalR connections/background tasks a real chance to drain
            # on a liveness failure instead of an instant SIGKILL (was 1s).
            terminationGracePeriodSeconds: 30
          volumeMounts:
            - name: avm-trade-reporter-main-conf
              mountPath: /app/appsettings.json
              subPath: appsettings.json
            - name: avm-trade-reporter-images
              mountPath: /app/images
      volumes:
        - name: avm-trade-reporter-main-conf
          configMap:
            name: avm-trade-reporter-main-conf
        - name: avm-trade-reporter-images
          persistentVolumeClaim:
            claimName: avm-trade-reporter-images-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: avm-trade-reporter-service
  namespace: biatec-scan
spec:
  type: ClusterIP
  selector:
    app: avm-trade-reporter-app
  ports:
    - name: http
      protocol: TCP
      appProtocol: http
      port: 8080
      targetPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: avm-trade-reporter-nodeport-service
  namespace: biatec-scan
spec:
  type: NodePort
  selector:
    app: avm-trade-reporter-app
  ports:
    - name: http
      protocol: TCP
      appProtocol: http
      nodePort: 31808
      port: 8080
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: avm-trade-reporter-ingress-main
  namespace: biatec-scan
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - algorand-trades.de-4.biatec.io
      secretName: tls-algorand-trades.de-4.biatec.io
  rules:
    - host: algorand-trades.de-4.biatec.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: avm-trade-reporter-service
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: avm-trade-reporter-ingress-main2
  namespace: biatec-scan
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - api.algorand.scan.biatec.io
      secretName: tls-api.algorand.scan.biatec.io
  rules:
    - host: api.algorand.scan.biatec.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: avm-trade-reporter-service
                port:
                  number: 8080
