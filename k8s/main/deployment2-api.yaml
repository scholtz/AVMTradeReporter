apiVersion: apps/v1
kind: Deployment
metadata:
  name: avm-trade-reporter2-app-deployment
  namespace: biatec-scan
spec:
  selector:
    matchLabels:
      app: avm-trade-reporter2-app
  replicas: 0
  # See k8s/main/deployment-api.yaml for why this matters (only takes effect once replicas > 0).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 15
  # See k8s/main/deployment-api.yaml for why this must exceed the startupProbe budget below.
  progressDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app: avm-trade-reporter2-app
    spec:
      containers:
        - name: avm-trade-reporter2-app
          image: scholtz2/avm-trade-reporter:1.2026.08.22-main
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 200m
              memory: "200Mi"
            limits:
              cpu: 4000m
              memory: "1000Mi"
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: avm-trade-reporter2-secret
          # See k8s/main/deployment-api.yaml for why a startupProbe is required: startup blocks on
          # full cache warmup and must not be killed mid-warmup by a short-fused liveness probe.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            terminationGracePeriodSeconds: 30
          volumeMounts:
            - name: avm-trade-reporter-main-conf
              mountPath: /app/appsettings.json
              subPath: appsettings.json
            - name: avm-trade-reporter-images
              mountPath: /app/images
      volumes:
        - name: avm-trade-reporter-main-conf
          configMap:
            name: avm-trade-reporter-main-conf
        - name: avm-trade-reporter-images
          persistentVolumeClaim:
            claimName: avm-trade-reporter-images-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: avm-trade-reporter2-service
  namespace: biatec-scan
spec:
  type: ClusterIP
  selector:
    app: avm-trade-reporter2-app
  ports:
    - name: http
      protocol: TCP
      appProtocol: http
      port: 8080
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: avm-trade-reporter2-ingress-main
  namespace: biatec-scan
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - algorand-trades-2.de-4.biatec.io
      secretName: tls-algorand-trades-2.de-4.biatec.io
  rules:
    - host: algorand-trades-2.de-4.biatec.io
      http:
        paths:
          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: avm-trade-reporter2-service
                port:
                  number: 8080