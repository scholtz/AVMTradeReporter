# Stage's own claim on the shared ASA icon cache. Stage lives in the namespace biatec-scan-testnet, and a pod can
# only mount a PersistentVolumeClaim of its own namespace - production's avm-trade-reporter-images-pvc
# (k8s/main/pv-images.yaml, namespace biatec-scan) is out of reach, and the stage deployer must not touch it anyway.
#
# So stage gets a PV + PVC pair of its own, backed by the SAME host directory as production's PV: both
# environments still read and write one icon cache (the by-unitname sharing of docs/ICON_SHARING.md keeps working),
# but no stage object is in, or bound to anything in, biatec-scan. Same hostPath caveat as production's PV: real
# sharing needs every consuming pod on the node that holds the directory.
#
# Applied by the deploy-stage job (.github/workflows/deploy.yml) - the stage deployer may create PersistentVolumes
# (cluster-scoped) and PVCs in biatec-scan-testnet.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: avm-trade-reporter-stage-images-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: biatec-scan-shared-hostpath
  # binds to stage's claim only - never to a claim of another namespace
  claimRef:
    namespace: biatec-scan-testnet
    name: avm-trade-reporter-stage-images-pvc
  hostPath:
    path: /mnt/nvme1/biatec-scan-shared-drive/avm-trade-reporter-images
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: avm-trade-reporter-stage-images-pvc
  namespace: biatec-scan-testnet
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: biatec-scan-shared-hostpath
  resources:
    requests:
      storage: 20Gi
  volumeName: avm-trade-reporter-stage-images-pv
